name: Deploy Android

on:
  workflow_dispatch:
    inputs:
      destination:
        description: ส่งไปที่ไหน
        type: choice
        required: true
        default: app-distribution
        options:
          - app-distribution
          - google-play
          - both
      release_notes:
        description: ข้อความสำหรับผู้ทดสอบใน App Distribution (ว่าง = commit ที่ build)
        type: string
      play_status:
        description: สถานะ release บน Google Play (แอปที่ยังไม่เคยเผยแพร่ต้องใช้ draft)
        type: choice
        default: completed
        options:
          - completed
          - draft
      build_number:
        description: เลข build (ว่าง = คำนวณให้)
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-android
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/app-checks.yml

  deploy:
    name: Build and upload
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    env:
      TO_FIREBASE: ${{ inputs.destination != 'google-play' }}
      TO_PLAY: ${{ inputs.destination != 'app-distribution' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check settings
        env:
          APP_ENV_JSON: ${{ secrets.APP_ENV_JSON }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          required=(APP_ENV_JSON GOOGLE_SERVICES_JSON ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD)
          if [ "$TO_FIREBASE" = true ]; then required+=(FIREBASE_SERVICE_ACCOUNT_JSON); fi
          if [ "$TO_PLAY" = true ]; then required+=(PLAY_SERVICE_ACCOUNT_JSON); fi
          .github/scripts/require-env.sh "${required[@]}"

      - name: Set the build number
        env:
          BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
          BUILD_NUMBER_OFFSET: ${{ vars.BUILD_NUMBER_OFFSET }}
        run: .github/scripts/build-number.sh >> "$GITHUB_ENV"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true

      - name: Write config files and keystore
        env:
          APP_ENV_JSON: ${{ secrets.APP_ENV_JSON }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$APP_ENV_JSON" > app/env.json
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/android/app/google-services.json
          jq -e '.SUPABASE_URL and .SUPABASE_PUBLISHABLE_KEY' app/env.json > /dev/null
          jq -e '.project_info.project_id' app/android/app/google-services.json > /dev/null
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - run: flutter pub get --enforce-lockfile
        working-directory: app
      - run: dart run build_runner build
        working-directory: app

      - name: Build
        working-directory: app
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          args=(--release --target-platform android-arm64 --build-number="$BUILD_NUMBER" --dart-define-from-file=env.json)
          if [ "$TO_FIREBASE" = true ]; then flutter build apk "${args[@]}"; fi
          if [ "$TO_PLAY" = true ]; then flutter build appbundle "${args[@]}"; fi

      - name: Check that the build is not signed with the debug key
        working-directory: app/build/app/outputs
        run: |
          check() {
            if grep -q 'CN=Android Debug' <<< "$1"; then
              echo "::error::build ถูกเซ็นด้วย debug key"
              exit 1
            fi
          }
          if [ "$TO_FIREBASE" = true ]; then
            apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
            certs="$("$apksigner" verify --print-certs flutter-apk/app-release.apk)"
            check "$certs"
          fi
          if [ "$TO_PLAY" = true ]; then
            certs="$(keytool -printcert -jarfile bundle/release/app-release.aab)"
            grep -q 'SHA256' <<< "$certs"
            check "$certs"
          fi

      - name: Upload to Firebase App Distribution
        if: env.TO_FIREBASE == 'true'
        working-directory: app
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
          app_id="$(jq -er 'first(.client[] | select(.client_info.android_client_info.package_name == "com.codenour.anything") | .client_info.mobilesdk_app_id)' android/app/google-services.json)"
          project="$(jq -er '.project_info.project_id' android/app/google-services.json)"
          args=(--app "$app_id" --project "$project" --release-notes "${RELEASE_NOTES:-$GITHUB_SHA}")
          if [ -n "$TESTER_GROUPS" ]; then args+=(--groups "$TESTER_GROUPS"); fi
          npx -y firebase-tools@15.37.0 appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk "${args[@]}"

      - name: Upload to Google Play (internal testing)
        if: env.TO_PLAY == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.codenour.anything
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          mappingFile: app/build/app/outputs/mapping/release/mapping.txt
          tracks: internal
          status: ${{ inputs.play_status }}
